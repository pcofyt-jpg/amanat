<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AMANA — учёт рассрочки</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' rx='46' fill='%230A403B'/%3E%3Cpath d='M54 156V96C54 66 78 47 100 34C122 47 146 66 146 96V156' fill='none' stroke='%23D9AE55' stroke-width='12' stroke-linejoin='round'/%3E%3Cpath d='M40 156H160' stroke='%23D9AE55' stroke-width='12' stroke-linecap='round'/%3E%3Ccircle cx='100' cy='98' r='15' fill='%23D9AE55'/%3E%3Cpath d='M92 106L86 136H114L108 106Z' fill='%23D9AE55'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0E5B53">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --surface-2:#F5F7F6; --ink:#16282A; --ink-2:#4A5D5F; --ink-3:#7D8C8D;
  --line:#D9E0DE; --primary:#0E5B53; --primary-ink:#FFFFFF; --primary-soft:#DCEBE8;
  --brass:#A97C22; --brass-soft:#F4EAD3; --danger:#B03A27; --danger-soft:#F6E0DB; --ok:#2C7A4B; --ok-soft:#DDEFE3;
  --warn:#C08A1E; --due:#C9D3D1; --row-soon:#FFF1BF; --row-today:#F8D4CC;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A1B; --surface:#172426; --surface-2:#1D2D2F; --ink:#E6EEEC; --ink-2:#AFC0BE; --ink-3:#7F9391;
    --line:#2A3C3E; --primary:#4FB3A5; --primary-ink:#0F1A1B; --primary-soft:#1E3B38;
    --brass:#D9AE55; --brass-soft:#3A3120; --danger:#E7826F; --danger-soft:#3E2622; --ok:#6CC490; --ok-soft:#1F3A2A;
    --warn:#E0B04E; --due:#3A4C4E; --row-soon:#3D3517; --row-today:#4A2620;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A1B; --surface:#172426; --surface-2:#1D2D2F; --ink:#E6EEEC; --ink-2:#AFC0BE; --ink-3:#7F9391;
  --line:#2A3C3E; --primary:#4FB3A5; --primary-ink:#0F1A1B; --primary-soft:#1E3B38;
  --brass:#D9AE55; --brass-soft:#3A3120; --danger:#E7826F; --danger-soft:#3E2622; --ok:#6CC490; --ok-soft:#1F3A2A;
  --warn:#E0B04E; --due:#3A4C4E; --row-soon:#3D3517; --row-today:#4A2620;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 20px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;gap:12px;justify-content:space-between}
.lockup{display:inline-flex;align-items:center;gap:10px;vertical-align:middle;color:var(--primary)}
.lockup .lmark{flex:0 0 auto;border-radius:8px}
.lockup.big{flex-direction:column;gap:12px}
.cc .nm{color:#fff;display:flex}
.lmark.inv rect{fill:#D9AE55}.lmark.inv path,.lmark.inv circle{stroke:#0A403B}.lmark.inv circle,.lmark.inv path[fill="#D9AE55"]{fill:#0A403B}
.logo{font-family:Unbounded,"Golos Text",sans-serif;font-weight:700;font-size:20px;letter-spacing:.02em;color:var(--primary)}
.motto{color:var(--ink-3);font-size:13px}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:none;padding:8px 12px 11px;cursor:pointer;color:var(--ink-2);white-space:nowrap;border-bottom:2px solid transparent;font-weight:500}
.nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--primary)}
.nav .cnt{display:inline-block;margin-left:6px;font-size:12px;padding:0 6px;border-radius:9px;background:var(--danger-soft);color:var(--danger)}

main{max-width:1180px;margin:0 auto;padding:20px 20px 80px}
.banner{background:var(--brass-soft);color:var(--ink);border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:14px}

h2{font-size:18px;margin:0;font-weight:600}
h3{font-size:15px;margin:0 0 10px;font-weight:600}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.muted{color:var(--ink-3)}
.small{font-size:13px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;font-size:14px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dng{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}

/* hero */
.hero{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:22px}
.hero > div{background:var(--surface);padding:18px 20px}
.hero .lbl{color:var(--ink-2);font-size:13px}
.hero .val{font-family:Unbounded,"Golos Text",sans-serif;font-weight:500;font-size:clamp(22px,3.4vw,34px);line-height:1.15;margin-top:6px;letter-spacing:-.01em}
.hero .sub{font-size:13px;color:var(--ink-3);margin-top:4px}
.hero .bad .val{color:var(--danger)}
.hero .first .val{color:var(--primary)}

.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.panel + .panel{margin-top:22px}

.kv{display:grid;grid-template-columns:1fr auto;gap:8px 16px;font-size:14px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;text-align:right;font-weight:500}
.kv .sep{grid-column:1/-1;border-top:1px solid var(--line);margin:4px 0}
.kv .strong{font-weight:700}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:12px 4px;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:0}
.item.click{cursor:pointer}
.item.click:hover{background:var(--surface-2)}
.item .t{font-weight:600}
.item .s{color:var(--ink-3);font-size:13px}
.item .r{text-align:right}
.item .amt{font-weight:600}
.empty{padding:28px 8px;text-align:center;color:var(--ink-3)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:500;color:var(--ink-2);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
td.n,th.n{text-align:right;white-space:nowrap}
td.nw{white-space:nowrap}
tr.soon td{background:var(--row-soon)}
tr.today td{background:var(--row-today)}
tbody tr.click.soon:hover td{background:var(--row-soon);filter:brightness(.97)}
tbody tr.click.today:hover td{background:var(--row-today);filter:brightness(.97)}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0;background:var(--surface-2)}
.period{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.period input[type=date]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:22px}
.rgrid>div{background:var(--surface);padding:14px 16px}
.rgrid .lbl{font-size:13px;color:var(--ink-2)}
.rgrid .val{font-family:Unbounded,"Golos Text",sans-serif;font-weight:500;font-size:clamp(18px,2.4vw,24px);margin-top:4px}
.rgrid .sub{font-size:12px;color:var(--ink-3);margin-top:2px}
tr.sel td{background:var(--primary-soft)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:8px}.bar>i{display:block;height:100%;background:var(--ok)}
@media (max-width:860px){.rgrid{grid-template-columns:1fr 1fr}}
.lockwrap{min-height:calc(100vh - 160px);display:flex;align-items:center;justify-content:center;padding:20px 0}
.lockcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 26px;width:min(360px,100%);text-align:center}
.lockcard .logo{font-size:26px;margin-bottom:6px}
.lockcard h2{margin:10px 0 6px}
.pinin{font-family:Unbounded,"Golos Text",sans-serif;font-size:28px;letter-spacing:.5em;text-align:center;width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 8px 12px calc(8px + .5em);margin:16px 0 10px}
.pinerr{color:var(--danger);font-size:13px;min-height:18px}
.who{display:inline-flex;align-items:center;gap:6px}
.who img{width:20px;height:20px;border-radius:50%}
.rolebox{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.people .item{grid-template-columns:1fr auto}
.people select,.people input{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 9px}
.toggle{display:flex;gap:10px;align-items:center;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--primary)}
.lockbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.cc{background:linear-gradient(150deg,#0E5B53 0%,#0A403B 60%,#082F2B 100%);color:#fff;border-radius:22px;padding:22px 20px 20px;position:relative;overflow:hidden;box-shadow:0 18px 40px rgba(8,47,43,.25)}
.cc::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(217,174,85,.13)}
.cc h2{font-family:Unbounded,"Golos Text",sans-serif;font-weight:700;font-size:clamp(20px,5vw,26px);margin:0 0 4px;color:#fff}
.cc .sub{color:rgba(255,255,255,.7);font-size:13px;margin-bottom:18px}
.cc .lg{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cc .mark{width:38px;height:38px;border-radius:11px;background:#D9AE55;color:#0A403B;display:flex;align-items:center;justify-content:center;font-family:Unbounded,sans-serif;font-weight:700;font-size:18px}
.cc .nm{font-family:Unbounded,sans-serif;font-weight:700;letter-spacing:.06em;font-size:15px}
.cf{margin-bottom:16px;position:relative;z-index:1}
.cf label{display:block;font-size:14px;color:rgba(255,255,255,.85);margin-bottom:7px}
.cbox{display:flex;align-items:baseline;gap:6px;background:#fff;border-radius:14px;padding:10px 16px 12px}
.cbox input{flex:1;min-width:0;border:0;background:none;text-align:right;font-family:Unbounded,"Golos Text",sans-serif;font-size:24px!important;font-weight:500;color:#0F2A2A;outline:none;padding:0}
.cbox span{color:#4A5D5F;font-weight:600;font-size:16px}
.cf input[type=range]{width:100%;margin:10px 0 0;accent-color:#D9AE55;height:22px}
.cres{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px;position:relative;z-index:1}
.cres>div{background:#fff;border-radius:14px;padding:12px 8px;text-align:center;color:#0F2A2A}
.cres .l{font-size:12px;color:#4A5D5F;line-height:1.25;min-height:30px;display:flex;align-items:center;justify-content:center}
.cres .v{font-family:Unbounded,"Golos Text",sans-serif;font-weight:700;font-size:clamp(15px,4.2vw,20px);color:#0E5B53;margin-top:6px;border-top:1px solid #E3E9E7;padding-top:8px}
.cres .main{background:#F4EAD3}
.cres .main .v{color:#7A5713}
.calcgrid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
@media (max-width:860px){.calcgrid{grid-template-columns:1fr}}
.cfoot{margin-top:14px;font-size:12.5px;color:rgba(255,255,255,.75);position:relative;z-index:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin:10px 2px 0}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--sw)}

.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--danger-soft);color:var(--danger)}
.tag.act{background:var(--primary-soft);color:var(--primary)}
.tag.mid{background:var(--brass-soft);color:var(--brass)}
.tag.gray{background:var(--surface-2);color:var(--ink-3)}

/* the ribbon: one segment per installment */
.ribbon{display:flex;gap:3px;min-width:90px}
.ribbon i{flex:1;height:8px;border-radius:2px;background:var(--due);position:relative;overflow:hidden}
.ribbon i.paid{background:var(--ok)}
.ribbon i.overdue{background:var(--danger)}
.ribbon i.partial{background:linear-gradient(90deg,var(--ok) var(--p),var(--due) var(--p))}
.ribbon i.overdue.partial{background:linear-gradient(90deg,var(--ok) var(--p),var(--danger) var(--p))}
.ribbon.big i{height:14px;border-radius:3px}

.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.nav .cnt.new{background:var(--brass-soft);color:var(--brass)}
.applist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.app{margin:0}
.app .ah{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
.app .t{font-weight:700;font-size:17px}
.app .kv{margin-bottom:10px}
.app .kv dd{text-align:right;overflow-wrap:anywhere}
.app .pimg{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;margin-bottom:10px}
.app .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.app .acts select{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 10px;color:var(--ink)}
.app input.anote{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px;color:var(--ink);margin-bottom:10px}
.app.st-new{border-color:var(--brass);box-shadow:inset 4px 0 0 var(--brass)}
.linkbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.linkbox code{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;overflow-wrap:anywhere;flex:1 1 240px}
@media (max-width:640px){.applist{grid-template-columns:1fr}}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;min-width:200px}

/* modal */
dialog{border:0;padding:0;border-radius:16px;background:var(--surface);color:var(--ink);width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 32px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,20,20,.45)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.mb{padding:18px 20px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--ink-3);padding:4px 8px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.f{display:flex;flex-direction:column;gap:5px}
.f.full{grid-column:1/-1}
.f label{font-size:13px;color:var(--ink-2)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 11px;width:100%}
.f textarea{min-height:70px;resize:vertical}
.f .hint{font-size:12px;color:var(--ink-3)}
.mv{margin-left:5px;color:var(--brass);font-weight:700;cursor:help}
.gd summary{cursor:pointer;font-weight:600;color:var(--primary)}
.gd summary .muted{font-weight:400}
.inl{grid-column:1/-1;border:1px dashed var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.inl[hidden]{display:none}
.calc{grid-column:1/-1;background:var(--primary-soft);border-radius:10px;padding:12px 14px;font-size:14px}
.calc b{font-weight:700}
.note{grid-column:1/-1;font-size:13px;color:var(--ink-2);background:var(--brass-soft);border-radius:10px;padding:10px 12px}
.err{color:var(--danger);font-size:13px;grid-column:1/-1}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px}
.ph{position:relative;border-radius:10px;overflow:hidden;background:var(--surface-2);aspect-ratio:1;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph .cap{position:absolute;left:0;right:0;bottom:0;font-size:11px;padding:3px 6px;background:rgba(0,0,0,.55);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .rm{position:absolute;top:4px;right:4px;border:0;border-radius:6px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:2px 7px;cursor:pointer}
.ph .rm[data-armed]{background:var(--danger)}
.upl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.upl select{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 10px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:5;cursor:zoom-out;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px)}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.btn[data-armed]{background:var(--danger);border-color:var(--danger);color:#fff}
.nav .more{color:var(--ink-2)}
.bnav{display:none}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(8,20,20,.35);display:flex;align-items:flex-start;justify-content:flex-end;padding:96px 24px 24px}
.sheet[hidden]{display:none}
.sheet-in{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.18);padding:10px;width:min(340px,100%);max-height:calc(100dvh - 140px);overflow:auto}
.sheet-in h4{margin:6px 10px 8px;font-size:13px;color:var(--ink-3);font-weight:500}
.sheet-in .sbtn{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--ink);text-align:left;padding:12px 10px;border-radius:10px;font:inherit;font-size:15px;cursor:pointer}
.sheet-in .sbtn:hover,.sheet-in .sbtn:focus-visible{background:var(--surface-2)}
.sheet-in .sbtn[aria-current="page"]{background:var(--primary-soft);color:var(--primary);font-weight:600}
.sheet-in .sbtn .ic{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.sheet-in .sbtn .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sheet-in .sbtn .cnt{margin-left:auto;font-size:12px;padding:0 7px;border-radius:9px;background:var(--brass-soft);color:var(--brass)}
@media (max-width:640px){
  .nav{display:none}
  .top-in{padding-bottom:10px}
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav button{border:0;background:none;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;font-size:11px;padding:4px 0;cursor:pointer;position:relative}
  .bnav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .bnav button[aria-current="page"]{color:var(--primary);font-weight:600}
  .bnav .plus span.pl{width:46px;height:46px;border-radius:15px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-16px;box-shadow:0 6px 16px rgba(14,91,83,.35)}
  .bnav .plus svg{stroke:#fff;width:24px;height:24px;stroke-width:2.2}
  .bnav .bd{position:absolute;top:0;left:calc(50% + 6px);font-size:10.5px;min-width:17px;height:17px;border-radius:9px;background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:center;padding:0 4px}
  .sheet{align-items:flex-end;justify-content:center;padding:0}
  .sheet-in{width:100%;border-radius:20px 20px 0 0;max-height:80dvh;padding:12px 10px calc(16px + env(safe-area-inset-bottom,0px));border-bottom:0}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))!important}
}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.stat{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:4px 0}

@media (max-width:860px){
  .hero{grid-template-columns:1fr 1fr}
  .hero > .first{grid-column:1/-1}
  .cols,.grid2{grid-template-columns:1fr}
}
@media (max-width:520px){
  main{padding:16px 12px 80px}
  .top-in{padding:10px 12px 0}
  .motto{display:none}
  .form{grid-template-columns:1fr}
  .hide-m{display:none}
  .search{min-width:0;flex:1}
}
/* ---- phone layout ---- */
@media (max-width:860px){
  input,select,textarea,.search{font-size:16px!important}
}
@media (max-width:640px){
  html,body{overflow-x:hidden}
  .nav button{padding:8px 10px 11px;font-size:14px}
  .head{flex-direction:column;align-items:stretch}
  .head .filters{width:100%}
  .head .btn.pri{justify-content:center}
  .filters .chip{flex:0 0 auto}
  .hero .val{font-size:24px}
  .hero > div{padding:14px 16px}
  .tw:not(.keep){border:0;background:none;overflow:visible}
  .tw:not(.keep) table,.tw:not(.keep) tbody,.tw:not(.keep) tfoot,.tw:not(.keep) tr,.tw:not(.keep) td{display:block;width:100%}
  .tw:not(.keep) thead{display:none}
  .tw:not(.keep) tbody tr,.tw:not(.keep) tfoot tr{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px}
  .tw:not(.keep) tfoot tr{background:var(--surface-2)}
  .tw:not(.keep) td{border:0;padding:5px 0;display:flex;justify-content:space-between;gap:14px;align-items:center;text-align:right;background:none!important}
  .tw:not(.keep) td::before{content:attr(data-label);color:var(--ink-3);font-size:13px;font-weight:400;text-align:left;flex:0 0 auto;max-width:45%}
  .tw:not(.keep) td[data-label=""]::before{display:none}
  .tw:not(.keep) td:empty{display:none}
  .tw:not(.keep) td.n,.tw:not(.keep) td.nw{white-space:normal}
  .tw:not(.keep) td .ribbon{flex:1;max-width:60%}
  .tw:not(.keep) tr.soon{border-color:var(--warn);box-shadow:inset 4px 0 0 var(--warn)}
  .tw:not(.keep) tr.today{border-color:var(--danger);box-shadow:inset 4px 0 0 var(--danger)}
  .tw:not(.keep) tr.soon td,.tw:not(.keep) tr.today td{background:none!important}
  .tw:not(.keep) tr.soon{background:var(--row-soon)}
  .tw:not(.keep) tr.today{background:var(--row-today)}
  .tw:not(.keep) td:first-child{font-weight:600}
  dialog{width:100vw;max-width:100vw;max-height:100dvh;height:100dvh;margin:0;border-radius:0}
  dialog .mb{padding:14px 14px 20px}
  dialog .mh{padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
  dialog .mf{flex-wrap:wrap;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px))}
  dialog .mf .btn{flex:1 1 auto;justify-content:center}
  .item{grid-template-columns:1fr}
  .item .r{text-align:left}
  .item .r .row-actions{justify-content:flex-start!important}
  .kv{font-size:14px}
  .lockcard{padding:22px 18px}
  .tw.keep table{font-size:13px}
  .tw.keep th,.tw.keep td{padding:8px 6px}
  #meBox .who{font-size:0;gap:0}
  #meBox .who img{width:26px;height:26px}
  .brand{align-items:center}
  .legend{font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function addMonths(iso,k){const d=parseISO(iso);const day=d.getDate();const t=new Date(d.getFullYear(),d.getMonth()+k,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(day,last));return toISO(t)}

/* ---------- core calculations ---------- */
function dealCalc(d){
  const today=todayISO();
  const price=num(d.price), down=num(d.down), n=Math.max(1,Math.round(num(d.count)||1));
  const base=Math.max(0,price-down);
  const inst=Math.round(base/n);
  const pays=S.payments.filter(p=>p.dealId===d.id).sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.code||"").localeCompare(b.code||""));
  const paidInst=pays.reduce((s,p)=>s+num(p.amount),0);
  const waived=(d.ibra||[]).reduce((s,x)=>s+num(x.amount),0);
  let rest=paidInst+waived; const sched=[];
  for(let i=1;i<=n;i++){
    const amount=i<n?inst:base-inst*(n-1);
    const moved=!!(d.shifts&&d.shifts[i]);const due=moved?d.shifts[i]:dueDate(d.date,d.period,i);
    const got=Math.max(0,Math.min(amount,rest)); rest-=got;
    const left=amount-got;
    let st=left<=0?"paid":(due<today?"overdue":(got>0?"partial":"upcoming"));
    sched.push({i,due,amount,got,left,st,partial:got>0&&left>0,moved});
  }
  const received=down+paidInst, remaining=Math.max(0,price-received-waived);
  const overdue=sched.filter(x=>x.st==="overdue").reduce((s,x)=>s+x.left,0);
  const overdueCount=sched.filter(x=>x.st==="overdue").length;
  const next=sched.find(x=>x.left>0);
  const product=byId("products",d.productId), client=byId("clients",d.clientId);
  const cost=product?num(product.cost):num(d.cost);
  const status=remaining<=0?"closed":(overdue>0?"overdue":"active");
  const daysLate=sched.filter(x=>x.st==="overdue").reduce((m,x)=>Math.max(m,daysBetween(x.due,today)),0);
  return {price,down,n,inst,sched,pays,paidInst,received,remaining,overdue,overdueCount,next,product,client,cost,markup:price-cost-waived,waived,status,daysLate};
}
function allDeals(){return S.deals.map(d=>({d,c:dealCalc(d)})).sort((a,b)=>(b.d.date||"").localeCompare(a.d.date||"")||(b.d.code||"").localeCompare(a.d.code||""))}
function productStatus(p){const deal=S.deals.find(d=>d.productId===p.id);return deal?{sold:true,deal}:{sold:false}}
function partnerName(id){const p=byId("partners",id);return p?p.name:"—"}

function cashLedger(){
  const ops=[];
  S.loans.forEach(l=>{
    const cap=l.kind==="capital";
    ops.push({date:l.date,in:num(l.amount),what:(cap?"Вклад в капитал от ":"Займ от ")+(l.fromName||partnerName(l.partnerId)),ref:l.code,kind:"loan"});
    (l.returns||[]).forEach(r=>ops.push({date:r.date,out:num(r.amount),what:(cap?"Возврат капитала — ":"Возврат займа — ")+(l.fromName||partnerName(l.partnerId)),ref:l.code,kind:"loan"}));
  });
  S.products.forEach(p=>{if(p.fromCash!==false&&num(p.cost)>0)ops.push({date:p.date,out:num(p.cost),what:"Закупка: "+[p.name,p.model].filter(Boolean).join(" "),ref:p.code,kind:"product"})});
  S.deals.forEach(d=>{if(num(d.down)>0){const c=byId("clients",d.clientId);ops.push({date:d.date,in:num(d.down),what:"Первый взнос — "+(c?c.name:""),ref:d.code,kind:"pay"})}});
  S.payments.forEach(p=>{const d=byId("deals",p.dealId);const c=d&&byId("clients",d.clientId);ops.push({date:p.date,in:num(p.amount),what:"Платёж — "+(c?c.name:"")+(d?" ("+d.code+")":""),ref:p.code,kind:"pay"})});
  S.expenses.forEach(e=>ops.push({date:e.date,out:num(e.amount),what:"Расход: "+(e.category||"")+(e.desc?" — "+e.desc:""),ref:e.code,kind:"exp"}));
  S.payouts.forEach(p=>ops.push({date:p.date,out:num(p.amount),what:"Выплата прибыли — "+partnerName(p.partnerId)+(p.label?" ("+p.label+")":""),ref:"",kind:"payout"}));
  S.cash.forEach(c=>ops.push({date:c.date,in:c.dir==="in"?num(c.amount):0,out:c.dir==="out"?num(c.amount):0,what:c.desc||"Прочая операция",ref:"",kind:"manual",id:c.id}));
  ops.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  let bal=0; ops.forEach(o=>{bal+=(o.in||0)-(o.out||0);o.bal=bal});
  return {ops,bal};
}

async function save(col,id,data){
  if(!canAdd()){toast("Нет прав на изменение");return false}

  data={...data,updatedAt:now,updatedBy:ME.id||null};
  if(!old){data.createdAt=data.createdAt||now;data.createdBy=ME.id||null}
  else{if(old.createdBy)data.createdBy=old.createdBy}
  try{
    if(db){ if(id) await db.collection(col).doc(id).set(data); else await db.collection(col).add(data); }

async function remove(col,id){
  if(!canDel()&&!(col==="photos"&&canAdd())){toast("Удалять может только владелец");return false}

}

function vHome(deals){
  const today=todayISO(), d7=addDays(today,7), d30=addDays(today,30);
  const sales=deals.reduce((s,x)=>s+x.c.price,0), cost=deals.reduce((s,x)=>s+x.c.cost,0);

  const overdue=deals.reduce((s,x)=>s+x.c.overdue,0);

    ${isFull()?`<div><div class="lbl">В кассе</div><div class="val">${rub(cash)}</div><div class="sub">свободные деньги на закупку</div></div>`:`<div><div class="lbl">Ожидается за 30 дней</div><div class="val">${rub(sum30)}</div><div class="sub">по графикам платежей</div></div>`}
    <div class="${overdue>0?"bad":""}"><div class="lbl">Просрочено</div><div class="val">${rub(overdue)}</div><div class="sub">${odCount?odCount+" платеж(ей) не внесено":"все платят вовремя"}</div></div>
  </section>
  ${backupBanner()}
  ${nothing&&isFull()?`<div class="panel"><h3>С чего начать</h3><p class="muted">Запишите займ или вклад партнёра — откуда пришли деньги. Затем оформите сделку: нового клиента и купленный товар можно добавить прямо в ней.</p>${W(`<div class="row-actions"><button class="btn pri" data-a="new-deal">Новая сделка</button><button class="btn" data-a="new-loan">Записать займ</button></div>`)}</div>`:""}
  <div class="cols">
    <section class="panel">
      <div class="head"><h2>Платежи на 30 дней</h2>${W(`<div class="row-actions"><button class="btn pri sm" data-a="new-pay">Принять платёж</button><button class="btn sm" data-a="new-deal">Новая сделка</button></div>`)}</div>
      <div class="small muted" style="margin:-6px 0 8px">7 дней: <b>${rub(sum7)}</b> · 30 дней: <b>${rub(sum30)}</b></div>
      <div class="list">${due.length?due.map(({d,c,x})=>{
        const late=x.st==="overdue", dd=daysBetween(today,x.due);
        const when=late?`<span class="tag bad">просрочен ${-dd} дн.</span>`:dd===0?`<span class="tag mid">сегодня</span>`:`<span class="muted small">${fmtD(x.due)} · через ${dd} дн.</span>`;
        return `<div class="item"><div><div class="t">${esc(c.client?c.client.name:"?")} <span class="muted small">${esc(d.code)} · платёж ${x.i} из ${c.n}</span></div><div class="s">${when}</div></div>
        <div class="r"><div class="amt">${rub(x.left)}</div><div class="row-actions" style="justify-content:flex-end;margin-top:4px">${W(`<button class="btn sm" data-a="pay" data-id="${d.id}">Принять</button>`)}${waLink(c,x,late)}</div></div></div>`}).join(""):`<div class="empty">В ближайшие 30 дней платежей нет</div>`}</div>
    </section>
    ${isFull()?`<div>
      <section class="panel">
        <h3>Финансовый результат</h3>
        <dl class="kv">
          <dt>Продано в рассрочку</dt><dd>${rub(sales)}</dd>
          <dt>Себестоимость</dt><dd>${rub(cost)}</dd>

        </dl>
        <p class="small muted" style="margin:10px 0 0">Прибыль считается по подписанным сделкам. Фактически получено от клиентов: ${rub(recv)}.</p>

  </div>`;

                :`Ассаляму алейкум, ${name}! Напоминаем о платеже по рассрочке AMANA: ${rub(x.left)} до ${fmtD(x.due)}. БаракаЛлаху фикум!`;

function urgency(c){if(!c.next||c.status==="closed")return {cls:"",note:""};const dd=daysBetween(todayISO(),c.next.due);
  if(dd<0)return {cls:"today",note:"просрочен "+(-dd)+" дн."};if(dd===0)return {cls:"today",note:"сегодня"};if(dd<=3)return {cls:"soon",note:"через "+dd+" дн."};return {cls:"",note:""}}
function plural(n,a,b,c){const m=n%10,k=n%100;return m===1&&k!==11?a:m>=2&&m<=4&&(k<10||k>=20)?b:c}
function clientStats(cl){const ds=allDeals().filter(x=>x.d.clientId===cl.id);return {ds,total:ds.reduce((s,x)=>s+x.c.price,0),paid:ds.reduce((s,x)=>s+x.c.received,0),debt:ds.reduce((s,x)=>s+x.c.remaining,0),od:ds.reduce((s,x)=>s+x.c.overdue,0)}}

  const loans=[...S.loans].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  return `<div class="grid2">

      const paid=S.payouts.filter(x=>x.partnerId===p.id).reduce((s,x)=>s+num(x.amount),0);
      return `<div class="item click" data-a="partner" data-id="${p.id}"><div><div class="t">${esc(p.name)} ${p.kind==="partner"?`<span class="tag mid">доля ${num(p.share)}%</span>`:`<span class="tag gray">займ</span>`}</div><div class="s">${esc(p.role||"")}${p.phone?" · "+esc(p.phone):""}${paid?" · выплачено прибыли "+rub(paid):""}</div></div><div class="r"><div class="amt">${rub(given-back)}</div><div class="s">внёс ${rub(given)}</div></div></div>`}).join(""):`<div class="empty">Партнёров пока нет</div>`}</div></div>
  </section>
  <section>

function loadImg(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{URL.revokeObjectURL(url);res(img)};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("bad image"))};img.src=url})}
async function compress(file){
  const img=await loadImg(file);
  for(const [max,q] of [[1400,.8],[1200,.72],[1000,.65],[850,.6],[700,.55]]){
    let w=img.naturalWidth,hh=img.naturalHeight;const k=Math.min(1,max/Math.max(w,hh));w=Math.round(w*k);hh=Math.round(hh*k);
    const cv=document.createElement("canvas");cv.width=w;cv.height=hh;const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,w,hh);ctx.drawImage(img,0,0,w,hh);
    const d=cv.toDataURL("image/jpeg",q); if(d.length<235000)return d;
  }
  throw new Error("too big");
}

/* deal */
function autoMarkup(cost,down,n,period){
  const st=calcSettings();const fin=Math.max(0,cost-down);n=Math.max(1,Math.round(n||1));if(!fin)return 0;
  const months=period==="week"?n*7/30.44:period==="biweek"?n*14/30.44:period==="once"?1:n;
  let mk=Math.round(fin*st.rate/100*months);
  if(st.round>1){const inst=Math.ceil((fin+mk)/n/st.round)*st.round;mk=inst*n-fin}
  return mk;
}

function dealCalcPreview(src){
  const o=formData();const cost=dealCost(o);

  if(src==="markup"||src==="price")dlg.dataset.mk="manual";
  if(src==="auto")dlg.dataset.mk="auto";
  const n=Math.max(1,Math.round(num(o.count)||1)),down=num(o.down);
  if(dlg.dataset.mk==="auto"){const m=cost?autoMarkup(cost,down,o.period==="once"?1:n,o.period):0;mk.value=cost?m:"";pr.value=cost?cost+m:""}
  else if(src==="markup"&&o.markup!=="")pr.value=cost+num(o.markup);
  else if(o.price!=="")mk.value=num(pr.value)-cost;
  const price=num(pr.value),base=price-down,nn=o.period==="once"?1:n,inst=Math.round(base/nn);
  const first=o.date?dueDate(o.date,o.period,1):"";
  const el=$("#calc");if(!el)return;

  el.innerHTML=`Себестоимость ${rub(cost)} + наценка <b>${rub(price-cost)}</b> = цена <b>${rub(price)}</b><br>`+

   `${nn} ${plural(nn,"платёж","платежа","платежей")} по <b>${rub(inst)}</b>${nn>1&&base-inst*(nn-1)!==inst?` (последний ${rub(base-inst*(nn-1))})`:""}, первый — ${fmtD(first)}`+

  if(o.clientId==="__new"){if(o.nc_name.length<2)return showErr("Укажите имя нового клиента");const dup=findByPhone(o.nc_phone);if(dup)return showErr(`Клиент с таким телефоном уже есть: ${dup.name} (${dup.code}). Выберите его в списке клиентов.`)}
  if(o.productId==="__new"){if(o.np_name.length<2)return showErr("Укажите, какой товар купили");if(num(o.np_cost)<=0)return showErr("Укажите закупочную цену товара");if(!o.np_date)return showErr("Укажите дату покупки товара")}
  if(S.deals.some(d=>d.code===o.code))return showErr("Такой номер сделки уже есть");
  const gu=guarFrom(o);if(!gu.name&&(gu.phone||gu.passport||gu.address))return showErr("Укажите ФИО поручителя");
  const price=num(o.price),down=num(o.down),n=Math.round(num(o.count)),cost=dealCost(o);
  if(n<1||n>120)return showErr("Количество платежей от 1 до 120");
  if(price<=0)return showErr("Укажите цену продажи");
  if(down>=price)return showErr("Первый взнос должен быть меньше цены");
  if(price<cost)return showErr("Цена продажи ниже себестоимости — проверьте суммы");
  const pdate=o.productId==="__new"?o.np_date:(byId("products",o.productId)||{}).date;
  if(pdate&&o.date<pdate)return showErr("Дата сделки раньше даты покупки товара — AMANA ещё не владела им");
  const btn=dlg.querySelector("[data-a=save-deal]");if(btn)btn.disabled=true;
  const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
  try{
    let productId=o.productId,clientId=o.clientId;
    if(productId==="__new"){productId=uid();if(!(await save("products",productId,{code:nextCode("products","T",3),category:"",name:o.np_name,model:"",serial:o.np_serial,cost:num(o.np_cost),date:o.np_date,supplier:"",fromCash:o.np_cash!=="no"})))return}
    if(clientId==="__new"){clientId=uid();if(!(await save("clients",clientId,{code:nextCode("clients","А",1),date:todayISO(),name:o.nc_name,phone:o.nc_phone,city:""})))return}
    const d={code:o.code,date:o.date,clientId,productId,cost,price,down,count:o.period==="once"?1:n,period:o.period,manager:o.manager,note:o.note,createdAt:new Date().toISOString()};
    if(gu.name)d.guarantor=gu;
    if(await save("deals",null,d)){
      if(o.appId&&SB)appUpdate(o.appId,{client_id:clientId,status:"approved"});
      closeModal();toast("Сделка оформлена, график построен");
    }
  }finally{if(btn)btn.disabled=false}
}

    t.querySelectorAll("tbody tr, tfoot tr").forEach(tr=>{let col=0;[...tr.children].forEach(td=>{const span=+td.getAttribute("colspan")||1;

  try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  catch(e){let h1=0x811c9dc5;for(let i=0;i<s.length;i++){h1^=s.charCodeAt(i);h1=Math.imul(h1,16777619)}return "f"+(h1>>>0).toString(16)}
}

async function doUnlock(){

  if(!PIN)return;
  if(await sha(PIN.salt+":"+v)===PIN.hash){unlocked=true;pinFails=0;touchUnlock();draw();return}
  pinFails++; if(pinFails>=5){pinBlockUntil=Date.now()+30000;pinFails=0;logIt("Ошибка входа","pin","5 неверных попыток ввода ПИН-кода");draw();setTimeout(draw,30100);return}
  if(err)err.textContent="Неверный ПИН. Осталось попыток: "+(5-pinFails); const i=$("#pin1"); if(i){i.value="";i.focus()}

async function setPin(){
  const a=($("#pin1")||{}).value||"",b=($("#pin2")||{}).value||"",err=$("#pinerr");
  if(!/^\d{4,6}$/.test(a)){err.textContent="ПИН — от 4 до 6 цифр";return}
  if(a!==b){err.textContent="ПИН-коды не совпадают";return}
  if(/^(\d)\1+$/.test(a)||"0123456789".includes(a)||"9876543210".includes(a)){err.textContent="Слишком простой ПИН, придумайте другой";return}
  const salt=Math.random().toString(36).slice(2,10)+Date.now().toString(36);
  const doc={hash:await sha(salt+":"+a),salt,setAt:new Date().toISOString()};
  try{await db.collection("pins").doc(ME.id).set(doc);PIN=doc;unlocked=true;touchUnlock();closeModal();logIt("Изменил","pin","ПИН-код установлен");toast("ПИН-код сохранён");draw()}

function calcInstallment(price,down,n,rate,round){
  price=Math.max(0,Math.round(price));down=Math.max(0,Math.min(Math.round(down),price));n=Math.max(1,Math.round(n));
  const fin=price-down;if(fin<=0)return {fin:0,markup:0,total:price,monthly:0,last:0,n,price,down};
  let markup=Math.round(fin*rate/100*n);let monthly=(fin+markup)/n;
  if(round>1){monthly=Math.ceil(monthly/round)*round;markup=monthly*n-fin}else monthly=Math.round(monthly);
  const last=fin+markup-monthly*(n-1);
  return {fin,markup,total:price+markup,monthly,last,n,price,down};
}

async function saveShift(dealId,i){
  const d=byId("deals",dealId);if(!d)return;const c=dealCalc(d);const o=formData();const x=c.sched.find(s=>s.i===+(o.inst||i));if(!x)return;

  const [y1,m1]=x.due.split("-").map(Number),[y2,m2]=o.to.split("-").map(Number);const md=(y2-y1)*12+(m2-m1);

function drawQrPoster(url){
  const W=1080,H=1350;const cv=document.createElement("canvas");cv.width=W;cv.height=H;const x=cv.getContext("2d");
  const D='"Unbounded","Golos Text",Arial,sans-serif',T='"Golos Text",Arial,sans-serif';
  brandCanvas(x,W,H);
  x.fillStyle="#fff";x.font=`700 60px ${D}`;x.fillText("Рассрочка",70,280);x.fillText("без процентов",70,352);
  x.fillStyle="rgba(255,255,255,.75)";x.font=`400 32px ${T}`;x.fillText("Наведите камеру телефона на код:",72,412);x.fillText("посчитайте платёж и оставьте заявку",72,454);
  const q=QR.encode(url,"H");const card=720,cx=(W-card)/2,cy=500;
  x.fillStyle="#fff";rr(x,cx,cy,card,card,40);x.fill();
  const s=Math.floor((card-80)/(q.size+2));const qs=s*q.size,ox=cx+(card-qs)/2,oy=cy+(card-qs)/2;
  x.fillStyle="#0A403B";for(let r=0;r<q.size;r++)for(let c=0;c<q.size;c++)if(q.M[r][c])x.fillRect(ox+c*s,oy+r*s,s,s);
  const L=s*Math.max(7,Math.round(q.size*0.2));const lx=W/2-L/2,ly=oy+qs/2-L/2;
  x.fillStyle="#fff";rr(x,lx-s,ly-s,L+2*s,L+2*s,L*0.26);x.fill();
  x.save();x.translate(lx,ly);x.scale(L/200,L/200);x.fillStyle="#0A403B";rr(x,0,0,200,200,46);x.fill();
  x.strokeStyle="#D9AE55";x.fillStyle="#D9AE55";x.lineWidth=12;x.lineJoin="round";x.lineCap="round";
  x.stroke(new Path2D("M54 156V96C54 66 78 47 100 34C122 47 146 66 146 96V156"));x.stroke(new Path2D("M40 156H160"));
  x.beginPath();x.arc(100,98,15,0,Math.PI*2);x.fill();x.fill(new Path2D("M92 106L86 136H114L108 106Z"));x.restore();
  x.textAlign="center";x.fillStyle="#D9AE55";x.font=`600 34px ${T}`;x.fillText("Без процентов и штрафов",W/2,cy+card+80);
  x.fillStyle="rgba(255,255,255,.6)";let fs=26;x.font=`400 ${fs}px ${T}`;const u=url.replace(/^https?:\/\//,"");while(x.measureText(u).width>W-140&&fs>16){fs--;x.font=`400 ${fs}px ${T}`}x.fillText(u,W/2,cy+card+128);
  return cv;
}

  const u=[["","один","два","три","четыре","пять","шесть","семь","восемь","девять"],["","одна","две","три","четыре","пять","шесть","семь","восемь","девять"]];

  const tens=["","","двадцать","тридцать","сорок","пятьдесят","шестьдесят","семьдесят","восемьдесят","девяносто"];
  const hund=["","сто","двести","триста","четыреста","пятьсот","шестьсот","семьсот","восемьсот","девятьсот"];

function distributionHTML(R){
  const partners=S.partners.filter(p=>p.kind==="partner"&&num(p.share)>0);

  const label=periodTitle(R.a,R.b);
  const loanOnly=S.partners.filter(p=>p.kind!=="partner");
  let rows="";
  if(partners.length){
    const capTotal=partners.reduce((s,p)=>s+S.loans.filter(l=>l.partnerId===p.id&&l.kind==="capital").reduce((a,l)=>a+num(l.amount),0),0);
    rows=partners.map(p=>{const amt=base>0?Math.round(base*num(p.share)/100):0;const cap=S.loans.filter(l=>l.partnerId===p.id&&l.kind==="capital").reduce((a,l)=>a+num(l.amount),0);
      const loss=base<0&&capTotal?Math.round(base*cap/capTotal):0;
      const paid=S.payouts.filter(x=>x.partnerId===p.id&&x.from===R.a&&x.to===R.b).reduce((s,x)=>s+num(x.amount),0);

      <p class="small muted">Делится только реально полученная прибыль. ${base<0?"Убыток по правилам мушараки распределяется пропорционально вложенному капиталу, а не долям прибыли.":""}</p>`
    :`<p class="small muted" style="margin:0">Партнёров с долей в прибыли нет. ${loanOnly.length?"Сейчас все партнёры дали займы — им возвращается ровно та же сумма, прибыль им не положена.":""} Если кто-то вкладывает деньги за долю, отметьте это в его карточке во вкладке «Займы и партнёры».</p>`}

function readZakatInputs(){const g=id=>{const e=document.getElementById(id);return e?(e.type==="checkbox"?e.checked:e.value):undefined};
  return {date:g("zkDate")||todayISO(),gold:num(g("zkGold")),stock:g("zkStock"),od:!!g("zkOd"),capital:!!g("zkCap")}}
function zakatCalc(z){
  const date=z.date;
  const cash=cashLedger().ops.filter(o=>o.date<=date).reduce((s,o)=>s+(o.in||0)-(o.out||0),0);
  const stockList=S.products.filter(p=>p.date<=date&&!S.deals.some(d=>d.productId===p.id&&d.date<=date));
  const stockCost=stockList.reduce((s,p)=>s+num(p.cost),0);
  const stock=z.stock!==undefined&&z.stock!==""?num(z.stock):stockCost;
  let good=0,doubt=0;
  allDeals().filter(x=>x.d.date<=date).forEach(({c})=>{if(c.remaining<=0)return;if(c.daysLate>90)doubt+=c.remaining;else good+=c.remaining});
  const qard=S.loans.filter(l=>l.kind!=="capital"&&l.date<=date).reduce((s,l)=>s+num(l.amount)-(l.returns||[]).filter(r=>r.date<=date).reduce((a,r)=>a+num(r.amount),0),0);
  const base=cash+stock+good+(z.od?doubt:0)-qard;
  const nisab=z.gold*85;
  return {cash,stock,stockCost,stockN:stockList.length,good,doubt,qard,base,nisab,due:z.gold>0&&base>=nisab?Math.round(base*0.025):0};
}

/* ---------- reports ---------- */
const MONTHS=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const inR=(d,a,b)=>d&&d>=a&&d<=b;
function periodReport(a,b){
  const deals=allDeals();
  const R={a,b};
  const nd=deals.filter(x=>inR(x.d.date,a,b));
  R.deals=nd; R.sales=nd.reduce((s,x)=>s+x.c.price,0); R.cost=nd.reduce((s,x)=>s+x.c.cost,0); R.markup=R.sales-R.cost;
  R.pays=[];
  deals.forEach(({d,c})=>{
    const net=c.price-c.waived;const share=net>0?c.markup/net:0;
    if(num(d.down)>0&&inR(d.date,a,b))R.pays.push({date:d.date,code:"взнос",deal:d,client:c.client,amount:num(d.down),method:"",who:d.manager||"",profit:num(d.down)*share});
    c.pays.forEach(p=>{if(inR(p.date,a,b))R.pays.push({date:p.date,code:p.code,deal:d,client:c.client,amount:num(p.amount),method:p.method||"",who:p.who||"",profit:num(p.amount)*share})});
  });
  R.pays.sort((x,y)=>x.date.localeCompare(y.date));
  R.received=R.pays.reduce((s,p)=>s+p.amount,0); R.realized=R.pays.reduce((s,p)=>s+p.profit,0);
  let due=0,dueGot=0; deals.forEach(({c})=>c.sched.forEach(x=>{if(inR(x.due,a,b)){due+=x.amount;dueGot+=x.got}})); R.due=due; R.dueGot=dueGot;
  R.exps=S.expenses.filter(e=>inR(e.date,a,b)).sort((x,y)=>x.date.localeCompare(y.date)); R.exp=R.exps.reduce((s,e)=>s+num(e.amount),0);
  R.byCat={}; R.exps.forEach(e=>{R.byCat[e.category||"Прочее"]=(R.byCat[e.category||"Прочее"]||0)+num(e.amount)});
  R.buys=S.products.filter(p=>inR(p.date,a,b)); R.buy=R.buys.reduce((s,p)=>s+num(p.cost),0);
  const {ops}=cashLedger(); let start=0,inS=0,outS=0;
  ops.forEach(o=>{if(o.date<a)start+=(o.in||0)-(o.out||0);else if(o.date<=b){inS+=o.in||0;outS+=o.out||0}});
  R.cashStart=start; R.cashIn=inS; R.cashOut=outS; R.cashEnd=start+inS-outS;
  R.loanIn=S.loans.filter(l=>inR(l.date,a,b)).reduce((s,l)=>s+num(l.amount),0);
  R.loanOut=S.loans.reduce((s,l)=>s+(l.returns||[]).filter(r=>inR(r.date,a,b)).reduce((q,r)=>q+num(r.amount),0),0);
  return R;
}
function monthsWithData(){
  const set=new Set();const add=d=>{if(d)set.add(d.slice(0,7))};
  S.deals.forEach(d=>add(d.date));S.payments.forEach(p=>add(p.date));S.expenses.forEach(e=>add(e.date));S.products.forEach(p=>add(p.date));S.loans.forEach(l=>add(l.date));
  set.add(todayISO().slice(0,7));
  return [...set].sort().reverse();
}
function monthRange(ym){const [y,m]=ym.split("-").map(Number);return [toISO0(new Date(y,m-1,1)),toISO0(new Date(y,m,0))]}
function periodTitle(a,b){
  const [ya,ma,da]=a.split("-").map(Number),[yb,mb,db]=b.split("-").map(Number);
  if(da===1&&ya===yb&&ma===mb&&b===monthRange(a.slice(0,7))[1])return MONTHS[ma-1]+" "+ya;
  if(da===1&&ma===1&&mb===12&&db===31&&ya===yb)return ya+" год";
  return fmtD(a)+" — "+fmtD(b);
}
function setPreset(p){
  const t=new Date(),y=t.getFullYear(),m=t.getMonth();
  if(p==="month"){ui.from=toISO0(new Date(y,m,1));ui.to=toISO0(new Date(y,m+1,0))}
  else if(p==="prev"){ui.from=toISO0(new Date(y,m-1,1));ui.to=toISO0(new Date(y,m,0))}
  else if(p==="quarter"){const q=Math.floor(m/3)*3;ui.from=toISO0(new Date(y,q,1));ui.to=toISO0(new Date(y,q+3,0))}
  else if(p==="year"){ui.from=y+"-01-01";ui.to=y+"-12-31"}
  else if(p==="all"){const all=[...S.deals.map(d=>d.date),...S.payments.map(x=>x.date),...S.expenses.map(x=>x.date),...S.products.map(x=>x.date),...S.loans.map(x=>x.date)].filter(Boolean).sort();ui.from=all[0]||todayISO();ui.to=todayISO()>(all[all.length-1]||"")?todayISO():all[all.length-1]}
  ui.preset=p;
}

    </div>
    <div>

        <dt>На начало (${fmtD(a)})</dt><dd>${rub(R.cashStart)}</dd><dt>Пришло</dt><dd style="color:var(--ok)">+ ${rub(R.cashIn)}</dd><dt>Ушло</dt><dd>− ${rub(R.cashOut)}</dd>
        <div class="sep"></div><dt class="strong">На конец (${fmtD(b)})</dt><dd class="strong">${rub(R.cashEnd)}</dd></dl>

      ${Object.keys(R.byCat).length?`<section class="panel"><h3>Расходы по категориям</h3><dl class="kv">${Object.entries(R.byCat).sort((x,y)=>y[1]-x[1]).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${rub(v)}</dd>`).join("")}</dl></section>`:""}

  ${R.pays.map(p=>`<tr class="click" data-a="deal" data-id="${p.deal.id}"><td class="nw">${fmtD(p.date)}</td><td>${esc(p.code)}</td><td>${esc(p.client?p.client.name:"")}</td><td>${esc(p.deal.code)}</td><td class="n">${rub(p.amount)}</td><td class="hide-m">${esc(p.method)}</td><td class="hide-m">${esc(p.who)}</td></tr>`).join("")}
  </tbody><tfoot><tr><td colspan="4">Итого</td><td class="n">${rub(R.received)}</td><td class="hide-m"></td><td class="hide-m"></td></tr></tfoot></table></div>`:`<div class="panel empty">Поступлений за период нет</div>`}

  ${months.map(ym=>{const [ma,mb]=monthRange(ym);const M=periodReport(ma,mb);const [y,m]=ym.split("-").map(Number);
    return `<tr class="click${a===ma&&b===mb?" sel":""}" data-a="month" data-v="${ym}"><td class="nw">${MONTHS[m-1]} ${y}</td><td class="n">${M.deals.length}</td><td class="n">${rub(M.sales)}</td><td class="n">${rub(M.markup)}</td><td class="n">${rub(M.received)}</td><td class="n">${rub(M.exp)}</td><td class="n">${rub(M.markup-M.exp)}</td><td class="n hide-m">${rub(M.cashEnd)}</td></tr>`}).join("")}

}
function exportPeriod(){
  if(!window.XLSX){toast("Модуль Excel не загрузился");return}
  const R=periodReport(ui.from,ui.to); const wb=XLSX.utils.book_new();
  const sum=[["AMANA — отчёт",periodTitle(ui.from,ui.to)],["Период",fmtD(ui.from)+" — "+fmtD(ui.to)],[],
    ["Оформлено сделок",R.deals.length],["Продано на сумму",R.sales],["Себестоимость",R.cost],["Наценка по новым сделкам",R.markup],["Расходы",R.exp],["Прибыль по сделкам",R.markup-R.exp],[],
    ["Поступило от клиентов",R.received],["Наценка в полученных деньгах",Math.round(R.realized)],["По графику ожидалось",R.due],["Из них внесено",R.dueGot],[],
    ["Касса на начало",R.cashStart],["Пришло",R.cashIn],["Ушло",R.cashOut],["Касса на конец",R.cashEnd],["Закупка товара",R.buy],["Получено займов",R.loanIn],["Возвращено займов",R.loanOut]];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sum),"Итог");
  const add=(n,rows)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows:[{}]),n);
  add("Поступления",R.pays.map(p=>({"Дата":fmtD(p.date),"№":p.code,"Клиент":p.client?p.client.name:"","Сделка":p.deal.code,"Сумма":p.amount,"Способ":p.method,"Принял":p.who})));
  add("Сделки",R.deals.map(({d,c})=>({"Дата":fmtD(d.date),"№":d.code,"Клиент":c.client?c.client.name:"","Товар":c.product?[c.product.name,c.product.model].join(" "):"","Себестоимость":c.cost,"Цена":c.price,"Наценка":c.markup})));
  add("Расходы",R.exps.map(e=>({"Дата":fmtD(e.date),"Категория":e.category,"Описание":e.desc||"","Сумма":num(e.amount),"Кто оплатил":e.who||""})));
  const out=XLSX.write(wb,{bookType:"xlsx",type:"array"}); const name="AMANA_отчёт_"+ui.from+"_"+ui.to+".xlsx";
  if(downloads){downloads.save({filename:name,data:out}).then(()=>toast("Отчёт сохранён")).catch(e=>{if(e&&e.code!=="declined")toast("Не удалось сохранить файл")})}
  else{if(saveBlob(name,new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})))toast("Отчёт сохранён")}
}

function exportXlsx(isBackup){
  if(!window.XLSX){toast("Модуль Excel не загрузился");return}
  const wb=XLSX.utils.book_new(); const add=(name,rows)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows:[{}]),name);
  const deals=allDeals();
  add("Клиенты",S.clients.map(c=>{const s=clientStats(c);return {"ID":c.code,"ФИО":c.name,"Телефон":c.phone||"","Город":c.city||"","Адрес":c.address||"","Поручитель":c.guarantor||"","Сделок":s.ds.length,"Сумма покупок":s.total,"Оплачено":s.paid,"Остаток":s.debt,"Просрочено":s.od}}));
  add("Товары",S.products.map(p=>{const st=productStatus(p);return {"ID":p.code,"Категория":p.category||"","Наименование":p.name,"Модель":p.model||"","IMEI":p.serial||"","Себестоимость":num(p.cost),"Дата покупки":fmtD(p.date),"Поставщик":p.supplier||"","Статус":st.sold?"Продан":"На складе","Сделка":st.sold?st.deal.code:""}}));
  add("Рассрочки",deals.map(({d,c})=>({"ID":d.code,"Дата":fmtD(d.date),"Клиент":c.client?c.client.name:"","Товар":c.product?[c.product.name,c.product.model].join(" "):"","Себестоимость":c.cost,"Цена":c.price,"Первый взнос":c.down,"Получено":c.received,"Остаток":c.remaining,"Наценка":c.markup,"Платежей":c.n,"Периодичность":PERIODS[d.period],"След. платёж":c.next?fmtD(c.next.due):"","Просрочено":c.overdue,"Статус":c.status==="closed"?"Закрыта":c.status==="overdue"?"Просрочка":"В процессе","Менеджер":d.manager||"","Поручитель":(guarOf(d,c.client)||{}).name||"","Тел. поручителя":(d.guarantor&&d.guarantor.phone)||""})));
  const g=[];deals.forEach(({d,c})=>c.sched.forEach(x=>g.push({"Сделка":d.code,"Клиент":c.client?c.client.name:"","№":x.i,"Дата":fmtD(x.due),"Сумма":x.amount,"Внесено":x.got,"Остаток":x.left,"Статус":{paid:"Оплачен",overdue:"Просрочен",partial:"Частично",upcoming:"Ожидается"}[x.st]})));add("График",g);
  add("Платежи",S.payments.map(p=>{const d=byId("deals",p.dealId);const c=d&&byId("clients",d.clientId);return {"ID":p.code,"Дата":fmtD(p.date),"Сделка":d?d.code:"","Клиент":c?c.name:"","Сумма":num(p.amount),"Способ":p.method||"","Принял":p.who||""}}));
  add("Касса",cashLedger().ops.map(o=>({"Дата":fmtD(o.date),"Операция":o.what,"Приход":o.in||0,"Расход":o.out||0,"Остаток":o.bal})));
  add("Займы",S.loans.map(l=>{const b=(l.returns||[]).reduce((a,r)=>a+num(r.amount),0);return {"ID":l.code,"Дата":fmtD(l.date),"Кто дал":partnerName(l.partnerId),"Сумма":num(l.amount),"Возвращено":b,"Остаток":num(l.amount)-b,"Срок":fmtD(l.due),"Назначение":l.purpose||""}}));
  add("Расходы",S.expenses.map(e=>({"ID":e.code,"Дата":fmtD(e.date),"Категория":e.category,"Описание":e.desc||"","Сумма":num(e.amount),"Кто оплатил":e.who||""})));
  add("Партнёры",S.partners.map(p=>({"Имя":p.name,"Телефон":p.phone||"","Роль":p.role||"","Участие":p.kind==="partner"?"Доля в прибыли":"Займ","Доля, %":num(p.share)})));
  add("Выплаты прибыли",S.payouts.map(p=>({"Дата":fmtD(p.date),"Партнёр":partnerName(p.partnerId),"Период":p.label||"","Сумма":num(p.amount)})));
  if(isFull())add("Журнал",[...LOG].sort((a,b)=>(b.at||"").localeCompare(a.at||"")).map(l=>({"Когда":(l.at||"").replace("T"," ").slice(0,16),"Кто":who(l.uid),"Действие":l.act,"Что":l.text})));
  const out=XLSX.write(wb,{bookType:"xlsx",type:"array"}); const name="AMANA_"+todayISO()+".xlsx";
  if(downloads){downloads.save({filename:name,data:out}).then(()=>{toast("Файл сохранён");if(isBackup)markBackup()}).catch(e=>{if(e&&e.code!=="declined")toast("Не удалось сохранить файл")})}
  else{if(saveBlob(name,new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}))){toast("Файл сохранён");if(isBackup)markBackup()}}
}

/* ---------- Supabase ---------- */
const CFG=window.AMANAT_CONFIG||{};
let SB=null, PROFILES={}, SESSION=null;
const reloaders={};
function sbDb(){
  const load=async col=>{const {data,error}=await SB.from("docs").select("id,data").eq("col",col);if(error)throw error;return data};
  const fire=col=>{(reloaders[col]||[]).forEach(f=>f())};
  SB.channel("docs-all").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{const col=(p.new&&p.new.col)||(p.old&&p.old.col);if(col)fire(col);else Object.keys(reloaders).forEach(fire)}).subscribe();
  return {collection(col){return {
    onSnapshot(cb,err){let t=null;const run=()=>{clearTimeout(t);t=setTimeout(async()=>{try{const rows=await load(col);cb({docs:rows.map(r=>({id:r.id,exists:true,data:()=>r.data}))})}catch(e){err&&err(e)}},60)};(reloaders[col]=reloaders[col]||[]).push(run);run();return()=>{}},
    async add(d){const id=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));const {error}=await SB.from("docs").insert({col,id,data:d});if(error)throw error;fire(col);return {id}},
    doc(id){return {
      async get(){const {data,error}=await SB.from("docs").select("data").eq("col",col).eq("id",id).maybeSingle();if(error)throw error;return {id,exists:!!data,data:()=>data&&data.data}},
      async set(d){const {error}=await SB.from("docs").upsert({col,id,data:d});if(error)throw error;fire(col)},
      async delete(){const {error}=await SB.from("docs").delete().eq("col",col).eq("id",id);if(error)throw error;fire(col)},
      onSnapshot(cb,err){const run=async()=>{try{cb(await this.get())}catch(e){err&&err(e)}};(reloaders[col]=reloaders[col]||[]).push(run);run();return()=>{}}
    }}
  }}};
}
function initials(s){const t=(s||"?").trim()[0]||"?";return "data:image/svg+xml;utf8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect width="40" height="40" rx="20" fill="#0E5B53"/><text x="20" y="26" font-family="sans-serif" font-size="18" fill="#fff" text-anchor="middle">${t.toUpperCase().replace(/[<&>]/g,"")}</text></svg>`)}
async function loadProfiles(){
  const {data,error}=await SB.from("profiles").select("id,email,label,role,last_seen");if(error||!data)return;
  PROFILES=Object.fromEntries(data.map(p=>[p.id,p]));
  SETTINGS.roles=Object.fromEntries(data.filter(p=>p.role&&p.role!=="pending").map(p=>[p.id,{role:p.role,label:p.label||""}]));
  data.forEach(p=>{NAMES[p.id]=p.label||p.email||""});
  MEMBERS=data.map(p=>({id:p.id,lastSeen:p.last_seen||""}));
  const me=PROFILES[ME.id];if(me){ME.isOwner=me.role==="admin";ME.name=me.label||me.email||"";ME.avatarUrl=initials(ME.name)}
  render();
}
userCap={profiles:async ids=>Object.fromEntries([].concat(ids).map(id=>[id,{id,name:(PROFILES[id]&&(PROFILES[id].label||PROFILES[id].email))||""}]))};

/* ---------- login ---------- */
function loginView(){
  const up=ui.authMode==="up";
  return `<div class="lockwrap"><div class="lockcard" style="text-align:left"><div class="logo" style="text-align:center">${LOGO_BIG}</div><h2 style="text-align:center">${up?"Регистрация":"Вход"}</h2>
  <div class="f" style="margin-top:14px"><label>Email</label><input id="lgEmail" type="email" autocomplete="username" style="border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px 12px"></div>
  <div class="f" style="margin-top:10px"><label>Пароль${up?" (не короче 8 символов)":""}</label><input id="lgPass" type="password" autocomplete="${up?"new-password":"current-password"}" style="border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px 12px"></div>
  <div class="pinerr" id="pinerr" style="margin-top:8px"></div>
  <button class="btn pri" style="width:100%;justify-content:center" data-a="${up?"signup":"login"}">${up?"Зарегистрироваться":"Войти"}</button>
  <p class="small muted" style="text-align:center;margin:14px 0 0">${up?`Уже есть аккаунт? <button class="lockbtn" data-a="auth-mode" data-v="in">Войти</button>`:`Нет аккаунта? <button class="lockbtn" data-a="auth-mode" data-v="up">Регистрация</button>`}</p></div></div>`;
}
async function doLogin(up){
  const email=($("#lgEmail")||{}).value?.trim(),pass=($("#lgPass")||{}).value||"",err=$("#pinerr");
  if(!email||!pass){err.textContent="Введите email и пароль";return}
  if(up&&pass.length<8){err.textContent="Пароль должен быть не короче 8 символов";return}
  err.textContent="Подождите…";
  const r=up?await SB.auth.signUp({email,password:pass}):await SB.auth.signInWithPassword({email,password:pass});
  if(r.error){err.textContent=/Invalid login/i.test(r.error.message)?"Неверный email или пароль":/registered/i.test(r.error.message)?"Такой email уже зарегистрирован":/confirm/i.test(r.error.message)?"Подтвердите email по ссылке из письма":"Ошибка: "+r.error.message;return}
  if(up&&!r.data.session){err.textContent="Готово! Подтвердите email по ссылке из письма, затем войдите.";ui.authMode="in";return}
  location.reload();
}
async function importJSON(file){
  try{
    const j=JSON.parse(await file.text());const data=j&&j.data;if(!data||(j.app!=="AMANA"&&j.app!=="AMAN"+"AT"))return toast("Это не копия AMANA");
    const rows=[];for(const col of COLS){(data[col]||[]).forEach(r=>{const {id,...rest}=r;if(id)rows.push({col,id:String(id),data:rest})})}
    if(!rows.length)return toast("В копии нет данных");
    toast("Загружаю "+rows.length+" записей…");
    for(let i=0;i<rows.length;i+=50){const {error}=await SB.from("docs").upsert(rows.slice(i,i+50));if(error){toast("Ошибка импорта: "+error.message);return}}
    COLS.forEach(c=>(reloaders[c]||[]).forEach(f=>f()));
    logIt("Добавил","backup","Импорт резервной копии: "+rows.length+" записей");toast("Импорт завершён: "+rows.length+" записей");
  }catch(e){toast("Не удалось прочитать файл")}
}

/* ---------- boot ---------- */
const _gate=gateView;
gateView=function(){if(SB&&!SESSION)return loginView();return _gate()};
draw();
(async()=>{
  if(!window.supabase||!CFG.SUPABASE_URL||/ВАШ/.test(CFG.SUPABASE_URL+CFG.SUPABASE_ANON_KEY)){offline=true;$("#app").innerHTML=`<div class="lockwrap"><div class="lockcard"><div class="logo">${LOGO_BIG}</div><h2>Нужна настройка</h2><p class="muted">Откройте файл index.html и вставьте адрес и ключ своего проекта Supabase в блок «НАСТРОЙКИ» в начале файла.</p></div></div>`;return}
  SB=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
  const {data:{session}}=await SB.auth.getSession();SESSION=session;
  if(!session){gateReady=true;draw();return}
  ME={id:session.user.id,isOwner:false,name:session.user.email||"",avatarUrl:initials(session.user.email)};
  SB.rpc("touch_me").then(()=>{},()=>{});
  db=sbDb();
  await loadProfiles();
  SB.channel("profiles-all").on("postgres_changes",{event:"*",schema:"public",table:"profiles"},()=>loadProfiles()).subscribe();
  if(!PROFILES[ME.id]){setTimeout(loadProfiles,1500)}
  try{const s=await db.collection("settings").doc("main").get();if(s.exists)SETTINGS={...SETTINGS,...s.data(),roles:SETTINGS.roles}}catch(e){}
  try{const p=await db.collection("pins").doc(ME.id).get();if(p.exists)PIN=p.data()}catch(e){}
  unlocked=!PIN||sessionUnlocked();
  db.collection("settings").doc("main").onSnapshot(s=>{SETTINGS={roles:SETTINGS.roles,requirePin:!!(s.exists&&s.data().requirePin)};render()},()=>{});
  gateReady=true; draw();
  let logSub=false;
  const subLog=()=>{if(logSub||!isFull()||!ME.id)return;logSub=true;db.collection("log").onSnapshot(s=>{LOG=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{})};
  subLog(); setInterval(subLog,3000);
  let subbed=false;
  const subData=()=>{if(subbed||["pending","blocked"].includes(role()))return;subbed=true;
    COLS.forEach(col=>{db.collection(col).onSnapshot(snap=>{S[col]=snap.docs.map(d=>({id:d.id,...d.data()}));loaded.add(col);render();if(col==="photos"&&dlg.dataset.client)refreshPhotos()},()=>{})})};
  subData(); setInterval(subData,3000);
  const subApps=()=>{if(appsSub||!canAdd())return;appsSub=true;loadApps();SB.channel("apps-all").on("postgres_changes",{event:"*",schema:"public",table:"applications"},()=>loadApps()).subscribe();setInterval(loadApps,60000)};
  subApps(); setInterval(subApps,3000);
})();
})();
